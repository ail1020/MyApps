name: Build APK

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "version.properties"

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up release keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ./keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # 4️⃣ Set environment variables for signing
      - name: Set signing environment variables
        run: |
          echo "KEYSTORE_PATH=../keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Read version info
        run: |
          MAJOR=$(grep MAJOR version.properties | cut -d'=' -f2 | tr -d ' ')
          MINOR=$(grep MINOR version.properties | cut -d'=' -f2 | tr -d ' ')
          PATCH=$(grep PATCH version.properties | cut -d'=' -f2 | tr -d ' ')
          VERSION_CODE=$(grep VERSION_CODE version.properties | cut -d'=' -f2 | tr -d ' ')

          VERSION_NAME="$MAJOR.$MINOR.$PATCH"

          echo "MAJOR=$MAJOR" >> $GITHUB_ENV
          echo "MINOR=$MINOR" >> $GITHUB_ENV
          echo "PATCH=$PATCH" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          
      - name: Build APK
        run: ./gradlew :app:assembleRelease

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Release v${{ env.VERSION_NAME }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment patch and versionCode
        run: |            
          PATCH=$((PATCH + 1))
          VERSION_CODE=$((VERSION_CODE + 1))
          
          NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            
          cat > version.properties <<EOF
          MAJOR=$MAJOR
          MINOR=$MINOR
          PATCH=$PATCH
          VERSION_CODE=$VERSION_CODE
          EOF
          
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV

      # Make sure this only touches version.properties, CI only ignores that file
      - name: Commit updated versions
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
    
          git add version.properties
          git commit -m "Prepare next version $NEXT_VERSION" || echo "No changes"
            
          git push